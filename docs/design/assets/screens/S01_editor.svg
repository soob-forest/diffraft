<text x="1420.0" y="832.0" fill="white" font-family="NanumGothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle">수정 요청</text>
<text x="1264" y="903" fill="#607083" font-family="NanumGothic, sans-serif" font-size="13" font-weight="400" text-anchor="start">요청 범위를 전체 문서로 바꾸려면</text>
