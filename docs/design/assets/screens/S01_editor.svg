<text x="268" y="402" fill="#607083" font-family="NanumGothic, sans-serif" font-size="13" font-weight="400" text-anchor="start">4</text>
<text x="318" y="402" fill="#182537" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">준비를 마치면 동행인에게 알립니다.</text>
<rect x="302" y="415" width="886" height="40" rx="0" fill="#EAF0FF" />
<text x="268" y="442" fill="#607083" font-family="NanumGothic, sans-serif" font-size="13" font-weight="400" text-anchor="start">5</text>
<text x="318" y="442" fill="#182537" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">출발 시간과 이동 경로를 함께 기록합니다.</text>
