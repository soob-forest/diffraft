<text x="318" y="722" fill="#182537" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">필요하면 다음 준비 사항을 정리합니다.</text>
<text x="268" y="762" fill="#607083" font-family="NanumGothic, sans-serif" font-size="13" font-weight="400" text-anchor="start">13</text>
<text x="318" y="762" fill="#182537" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">완료한 준비는 출발 전에 확인합니다.</text>
