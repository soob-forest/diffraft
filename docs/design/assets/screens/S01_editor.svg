<text x="318" y="562" fill="#182537" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">출발 전 10분 동안 준비물을 확인합니다.</text>
<text x="268" y="602" fill="#607083" font-family="NanumGothic, sans-serif" font-size="13" font-weight="400" text-anchor="start">9</text>
<text x="318" y="602" fill="#182537" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">준비가 늦어지면 진행 상황을 공유합니다.</text>
<text x="268" y="642" fill="#607083" font-family="NanumGothic, sans-serif" font-size="13" font-weight="400" text-anchor="start">10</text>
<text x="318" y="642" fill="#182537" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start" />
