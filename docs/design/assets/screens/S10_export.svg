<text x="20" y="989" fill="#607083" font-family="NanumGothic, sans-serif" font-size="12" font-weight="400" text-anchor="start">로컬 작업  ·  Markdown</text>
<text x="250" y="989" fill="#607083" font-family="NanumGothic, sans-serif" font-size="12" font-weight="400" text-anchor="start">AI 제안은 승인 후 반영됩니다.</text>
<text x="1400" y="989" fill="#607083" font-family="NanumGothic, sans-serif" font-size="12" font-weight="400" text-anchor="start">UTF-8   ·   LF</text>
<text x="250" y="210" fill="#182537" font-family="NanumGothic, sans-serif" font-size="15" font-weight="700" text-anchor="start">확정본 미리보기  ·  v14</text>
<rect x="248" y="240" width="964" height="682" rx="8" fill="white" stroke="#DCE3EA" />
<text x="288" y="298" fill="#182537" font-family="NanumGothic, sans-serif" font-size="30" font-weight="700" text-anchor="start">여행 준비 가이드</text>
<text x="288" y="370" fill="#182537" font-family="NanumGothic, sans-serif" font-size="22" font-weight="700" text-anchor="start">1. 출발 준비</text>
<text x="288" y="414" fill="#182537" font-family="NanumGothic, sans-serif" font-size="18" font-weight="400" text-anchor="start">준비 확인이 끝나면 동행인에게 바로 알립니다.</text>
<text x="288" y="458" fill="#607083" font-family="NanumGothic, sans-serif" font-size="18" font-weight="400" text-anchor="start">출발 시간과 이동 경로를 함께 기록합니다.</text>
<text x="288" y="536" fill="#182537" font-family="NanumGothic, sans-serif" font-size="22" font-weight="700" text-anchor="start">2. 확인 시간</text>
<text x="288" y="580" fill="#182537" font-family="NanumGothic, sans-serif" font-size="18" font-weight="400" text-anchor="start">출발 전 10분 동안 준비물을 확인합니다.</text>
<text x="288" y="624" fill="#607083" font-family="NanumGothic, sans-serif" font-size="18" font-weight="400" text-anchor="start">준비가 늦어지면 진행 상황을 공유합니다.</text>
<text x="288" y="702" fill="#182537" font-family="NanumGothic, sans-serif" font-size="22" font-weight="700" text-anchor="start">3. 여행 기록</text>
<text x="288" y="746" fill="#182537" font-family="NanumGothic, sans-serif" font-size="18" font-weight="400" text-anchor="start">여행자는 준비물과 다음 여행 계획을 여행 기록에 남깁니다.</text>
<text x="288" y="790" fill="#607083" font-family="NanumGothic, sans-serif" font-size="18" font-weight="400" text-anchor="start">완료한 준비는 출발 전에 확인합니다.</text>
<text x="1264" y="214" fill="#182537" font-family="NanumGothic, sans-serif" font-size="18" font-weight="700" text-anchor="start">확정본 내보내기</text>
<rect x="1264" y="242" width="145.90625" height="26" rx="13" fill="#E8F5EC" />
<text x="1274" y="260" fill="#14633B" font-family="NanumGothic, sans-serif" font-size="13" font-weight="700" text-anchor="start">확정본 v14 · 저장 완료</text>
<text x="1264" y="314" fill="#182537" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">승인된 문서 내용만 복사하거나 파일로 저</text>
<text x="1264" y="342" fill="#182537" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">장합니다.</text>
<rect x="1264" y="410" width="312" height="44" rx="6" fill="#2957C8" stroke="#2957C8" />
<text x="1420.0" y="437.0" fill="white" font-family="NanumGothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Markdown 복사</text>
<rect x="1264" y="470" width="312" height="44" rx="6" fill="white" stroke="#DCE3EA" />
<text x="1420.0" y="497.0" fill="#182537" font-family="NanumGothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle">.md 파일로 저장</text>
<rect x="1264" y="552" width="312" height="150" rx="8" fill="#F5F7FA" />
<text x="1282" y="584" fill="#182537" font-family="NanumGothic, sans-serif" font-size="14" font-weight="700" text-anchor="start">내보내기에 포함되지 않는 항목</text>
<text x="1282" y="619" fill="#607083" font-family="NanumGothic, sans-serif" font-size="14" font-weight="400" text-anchor="start">미승인 제안 · 코멘트 · 대화</text>
<text x="1282" y="651" fill="#607083" font-family="NanumGothic, sans-serif" font-size="14" font-weight="400" text-anchor="start">검토용 색상과 diff 기호</text>
<text x="1264" y="755" fill="#607083" font-family="NanumGothic, sans-serif" font-size="15" font-weight="400" text-anchor="start">복사한 내용은 원하는 문서 편집기에서 직</text>
<text x="1264" y="781" fill="#607083" font-family="NanumGothic, sans-serif" font-size="15" font-weight="400" text-anchor="start">접 확인하고 게시합니다.</text>
</svg>
