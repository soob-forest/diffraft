<text x="332" y="600" fill="#607083" font-family="NanumGothic, sans-serif" font-size="16" font-weight="400" text-anchor="start">실제 요청 가능 여부는 연결 테스트로 확인합니다. 이 테스트는 구독 사용 한도를 소비할 수 있습니다.</text>
<rect x="332" y="654" width="160" height="34" rx="6" fill="#2957C8" stroke="#2957C8" />
<text x="412.0" y="676.0" fill="white" font-family="NanumGothic, sans-serif" font-size="14" font-weight="700" text-anchor="middle">연결 테스트</text>
