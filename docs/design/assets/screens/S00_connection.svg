<text x="332" y="789" fill="#2957C8" font-family="NanumGothic, sans-serif" font-size="18" font-weight="700" text-anchor="start">앱에서 API credits 또는 결제 설정을 요구하지 않습니다.</text>
<text x="332" y="824" fill="#182537" font-family="NanumGothic, sans-serif" font-size="16" font-weight="400" text-anchor="start">로그인 문제가 있어도 로컬 문서 편집·비교·버전 복원은 계속 사용할 수 있습니다.</text>
