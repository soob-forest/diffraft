<rect x="1080" y="50" width="360" height="820" rx="0" fill="#f8fafc"/>
<rect x="1080" y="50" width="1" height="820" rx="0" fill="#dce4ee"/>
<text x="220" y="98" class="title">여행 준비 가이드</text>
<text x="420" y="98" class="small">v12</text>
<text x="456" y="98" class="small green">원문 저장됨</text>
<rect x="760" y="73" width="126" height="40" rx="6" fill="white" stroke="#c2cfe1"/>
