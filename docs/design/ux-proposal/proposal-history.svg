<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">이전 제안은 중앙에서 읽기 전용 비교</title>
<desc id="desc">DocReview 개선 제안 화면. 합성 예시이며 실제 앱 캡처가 아닙니다.</desc>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;font-size:16px;fill:#182537} .small{font-size:13px;fill:#526276}.muted{fill:#526276}.title{font-size:22px;font-weight:600}.heading{font-size:16px;font-weight:600}.blue{fill:#2957c8}.green{fill:#14633b}.red{fill:#a0332d}.white{fill:white}.mono{font-family:"SFMono-Regular",Menlo,"Apple SD Gothic Neo",monospace}</style>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="white"/>
<rect x="0" y="0" width="1440" height="50" rx="0" fill="#182537"/>
<rect x="20" y="11" width="28" height="28" rx="7" fill="#8eafff"/>
<text x="27" y="32" class="heading">D</text>
<text x="62" y="32" class="white heading">DocReview</text>
<text x="169" y="32" class="white small">내 작업 공간</text>
