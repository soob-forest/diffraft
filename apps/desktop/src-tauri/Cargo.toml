[package]
name = "docreview"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
default-run = "docreview"

[lib]
name = "docreview_core"

[[bin]]
name = "docreview"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "export-contracts"
path = "tools/export_contracts.rs"
required-features = ["contract-export"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
cc = "=1.10.0"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
rusqlite = { version = "=0.41.0", features = ["bundled", "backup"] }
sha2 = "=0.11.1"
uuid = { version = "=1.29.0", features = ["v4"] }
tempfile = "=3.27.0"
libc = "=0.2.191"
pulldown-cmark = "=0.13.5"
unicode-segmentation = "=1.13.3"
url = "=2.5.8"
similar = { version = "=3.2.1", features = ["unicode"] }
tauri = { version = "=2.12.5", optional = true, features = [] }
tauri-plugin-dialog = { version = "=2.8.3", optional = true }
tauri-plugin-clipboard-manager = { version = "=2.5.0", optional = true }
tauri-plugin-opener = { version = "=2.7.2", optional = true }
tauri-plugin-wdio = { version = "=1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-clipboard-manager"]
e2e = ["desktop", "dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
test-support = []
contract-export = []

[lints.clippy]
too_many_lines = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
